<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName askmaddi.com
    ServerAlias www.askmaddi.com

    DocumentRoot /opt/askmaddi-prod/browser
    <Directory /opt/askmaddi-prod/browser>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass        /health        http://127.0.0.1:5001/health
    ProxyPassReverse /health        http://127.0.0.1:5001/health
    ProxyPass        /instructions  http://127.0.0.1:5001/instructions
    ProxyPassReverse /instructions  http://127.0.0.1:5001/instructions
    ProxyPass        /proxy         http://127.0.0.1:5001/proxy
    ProxyPassReverse /proxy         http://127.0.0.1:5001/proxy
    ProxyPass        /ping          http://127.0.0.1:5001/ping
    ProxyPassReverse /ping          http://127.0.0.1:5001/ping
    ProxyPass        /ebay  http://127.0.0.1:5001/ebay
    ProxyPassReverse /ebay  http://127.0.0.1:5001/ebay
    ProxyPass        /admin http://127.0.0.1:5001/admin
    ProxyPassReverse /admin http://127.0.0.1:5001/admin
    ProxyPass        /subscribe http://127.0.0.1:5001/subscribe
    ProxyPassReverse /subscribe http://127.0.0.1:5001/subscribe
    ProxyPass        /search  http://127.0.0.1:5001/search
    ProxyPassReverse /search  http://127.0.0.1:5001/search
    ProxyPass        /adorama http://127.0.0.1:5001/adorama
    ProxyPassReverse /adorama http://127.0.0.1:5001/adorama

    ErrorLog  /var/log/httpd/askmaddi.com-error.log
    CustomLog /var/log/httpd/askmaddi.com-access.log combined

Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/ramish.io/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/ramish.io/privkey.pem
</VirtualHost>
</IfModule>
