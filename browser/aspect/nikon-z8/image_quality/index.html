  <figure class="ax-q"><blockquote>By ISO3200, files are pretty mushy, although more texture can be extracted from the Raw files than out-of-camera Jpegs, which are subjectively bad across the board, even at the lowest sensitivities.</blockquote><figcaption>&mdash; Digital Camera World (<a href="https://www.digitalcameraworld.com/cameras/action-cameras/kodak-pixpro-az653-review" rel="nofollow">source</a>)</figcaption></figure>
